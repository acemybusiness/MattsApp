name: Build Matt's Square App APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - shared.html
      - msa-logo.png
      - manifest.webmanifest
      - sw.js
      - package.json
      - capacitor.config.json
      - .github/workflows/build-android-apk.yml
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --ignore-scripts
      - name: Prepare locked web build
        run: |
          mkdir -p www
          cp index.html shared.html msa-logo.png manifest.webmanifest sw.js www/
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 80/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "80"/' android/app/build.gradle
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Matts-Square-App-v80-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
