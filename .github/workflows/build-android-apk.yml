name: Build Matt's Square App APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - shared.html
      - msa-logo.png
      - manifest.webmanifest
      - sw.js
      - icons/**
      - android-icon-res/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - .github/workflows/build-android-apk.yml

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Prepare locked web build
        run: |
          mkdir -p www/icons
          cp index.html shared.html msa-logo.png manifest.webmanifest sw.js www/
          cp icons/icon-192.png icons/icon-512.png www/icons/
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          cp -R android-icon-res/. android/app/src/main/res/
          sed -i 's/versionCode 1/versionCode 81/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "80.1"/' android/app/build.gradle
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Matts-Square-App-v80.1-Icon-Fix-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
